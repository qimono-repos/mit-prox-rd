[project]
name = "mit-prox-rd"
version = "0.1.0"
description = "MIT xPRO R&D: quantum funding data and geographic bubble-chart tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "pandas>=2.1"]

[project.scripts]
qc-funding-chart = "qc_funding_chart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_funding_chart"]
