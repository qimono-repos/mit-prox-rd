<text x="112" y="741" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#342d7a">How to read this:</text>
<text x="112" y="765" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#342d7a">Markers are published historical values, not every annual observation. Connecting lines are visual guides; they do not imply annual data between markers.</text>
<text x="90" y="802" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#53616d">Sources: Grupo EPC–ANPRES (2025 series and historical markers); CIICTI, ANPRES No. 32 (2026 projection). See accompanying README for notes and links.</text>
