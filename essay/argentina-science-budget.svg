<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Argentina's national science and technology budget, 1972–2026</title>
<desc id="desc">Selected historical observations of Argentina's national budget function for science and technology as a percentage of GDP. Values rise and fall across decades, peak at 0.354 percent in 2014 among the observations shown, and reach a reported historic low of 0.167 percent in 2025, with a 2026 projection of 0.164 percent.</desc>
<rect width="1400" height="820" fill="#fbfaf8"/>
<text x="90" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1b2733">Argentina’s science budget: a long, uneven curve</text>
<text x="90" y="94" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#53616d">National Budget Function for Science &amp; Technology • selected observations, 1972–2026</text>
<text x="90" y="123" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#53616d">Share of GDP (%) • 2026 is a projection based on budget execution through September</text>
<g stroke="#d9dee2" stroke-width="1">
